<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词汇应用挑战 · 梦幻收藏实验室</title><style>

ound:linear-gradient(145deg,#ffffffc9,#dfd2f0a6);box-shadow:0 8px 0 #aa98bb,0 13px 22px #6b548a26,inset 0 2px 3px #fff;backdrop-filter:blur(16px);border-radius:22px;min-height:68px;padding:14px 22px;font:700 22px inherit;color:var(--ink);cursor:pointer;transition:transform .16s,box-shadow .16s}.btn:hover{transform:translateY(-3px) scale(1.015)}.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #aa98bb}.btn:focus-visible{outline:4px solid #7858ca}.primary{background:linear-gradient(145deg,#f7c3e1,#c4b5ff)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0}.choices .btn{text-align:left;min-height:100px;font-size:clamp(21px,2.4vw,27px);overflow-wrap:anywhere}.toolbar{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin:20px 0}.select{font-size:22px;padding:14px;border-radius:16px;border:2px solid #e5d5fa;max-width:100%;background:#fff}.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;font-size:20px}.pill{padding:8px 15px;border-radius:20px;background:#ffffffaa}.bar{height:16px;border-radius:15px;background:#eee1f5;overflow:hidden;margin:18px 0}.bar>div{height:100%;background:linear-gradient(90deg,#b4d9f8,#b3e5d3,#e6b8ea);transition:width .4s}.question{font-weight:800;font-size:clamp(27px,3.5vw,38px);line-height:1.5;margin:22px 0}.hint{font-size:19px;opacity:.8}.word-detail{margin-top:14px;padding:20px;border-radius:18px;background:#fff;border:2px solid #ead9f7;font-size:24px;line-height:1.7}.word-detail strong{font-size:30px}.word-detail .pinyin{color:#795fa5;font-size:24px}.review-card{padding:20px;margin:15px 0;background:#fff;border:2px solid #e9d9f5;border-radius:20px;font-size:22px}.review-card input{font-size:24px;padding:12px;border:2px solid #d5c0ed;border-radius:14px;max-width:100%;width:320px}.review-card .btn{margin:10px 8px 0 0}.feedback{min-height:70px;padding:15px;border-radius:18px;background:#fff9e9;margin:16px 0;font-size:21px}.correct{background:#ddf8e8}.wrong{background:#ffe4e9}.hidden{display:none!important}.word-input{font-size:30px;border:3px solid #d9c4f1;border-radius:18px;padding:18px;width:100%;max-width:480px}.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match .btn{font-size:21px;min-height:80px}.selected{outline:4px solid #ae82e9}.matched{opacity:.45;pointer-events:none}.spark{position:fixed;pointer-events:none;font-size:30px;animation:spark 1.1s forwards;z-index:100}@keyframes spark{to{transform:translate(var(--dx),-150px) rotate(240deg);opacity:0}}.certificate{border:10px double #d7b8e9;border-radius:22px;background:#fffdf9;padding:32px;text-align:center}.certificate h2{font-size:42px}.certscore{font-size:64px;font-weight:900;color:#9273bf}.note{font-size:17px;color:#796982}.small{font-size:18px}.footer{text-align:center;font-size:15px;opacity:.6;padding:25px}@media(max-width:650px){.glass{padding:20px 15px;border-radius:22px}.choices{grid-template-columns:1fr}.shell{padding:10px}.btn{font-size:21px}.match .btn{font-size:18px;padding:9px}.question{font-size:27px}}@media print{body{background:white}.no-print,header,.orb,.footer{display:none!important}.shell{max-width:none}.glass{box-shadow:none;border:none}.certificate{break-inside:avoid}}
</style></head><body><div class="orb a"></div><div class="orb b"></div><header><div class="mascot" aria-hidden="true"><div class="ears"><div class="ear"></div><div class="ear r"></div></div><div class="face"><div class="eye"></div><div class="eye"></div><div class="nose"></div></div></div><h1>词汇应用挑战</h1><div class="sub">梦幻收藏实验室 · 五年级华文 · 第一课《实力会说话》</div></header><main class="shell"><section class="glass" id="home"><h2>开启你的词汇挑战</h2><p>5种玩法 · 大字体 · 80分及格 · 达标领取专属证书</p><div class="toolbar"><span class="pill">第一课《实力会说话》 · 14个词语</span><label>题目数量 <select class="select" id="count"><option value="5">5题</option><option value="10">10题</option><option value="14" selected>14题</option></select></label></div><div class="toolbar"><button class="btn primary" id="start">开始挑战</button><button class="btn" id="sound">语音：开启</button></div><p class="note">五种玩法：词义选择、拼音辨认、词语辨义、连线配对、汉字默写。所有题目及选项只来自第一课。</p></section><section class="glass hidden" id="game"><div class="stats"><span class="pill" id="progress"></span><span class="pill" id="score"></span><span class="pill" id="mode"></span></div><div class="bar"><div id="barfill" style="width:0%"></div></div><div class="question" id="question"></div><div class="hint" id="instruction"></div><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div id="wordDetail" class="word-detail hidden" aria-live="polite"></div><div class="toolbar"><button class="btn primary hidden" id="next">下一题</button><button class="btn" id="exit">返回主页</button></div></section><section class="glass hidden" id="result"><div id="resultContent"></div><div class="toolbar no-print"><button class="btn primary" id="retry">再挑战一次</button><button class="btn" id="print">打印证书</button><button class="btn" id="read">朗读成绩</button><button class="btn" id="back">返回主页</button></div><div id="review"></div></section></main><div class="footer">主题词汇练习 · 收藏玩偶风格原创界面</div><script>const DATA=[{"name": "实力会说话", "unit": 1, "words": [{"w": "即将", "p": "jí jiāng", "m": "很快就要发生。"}, {"w": "毒液", "p": "dú yè", "m": "含有毒性的液体。"}, {"w": "生肖", "p": "shēng xiào", "m": "用十二种动物代表出生年份。"}, {"w": "渺小", "p": "miǎo xiǎo", "m": "非常微小，不起眼。"}, {"w": "辩驳", "p": "biàn bó", "m": "提出理由反驳。"}, {"w": "控诉", "p": "kòng sù", "m": "指责或申诉。"}, {"w": "昼伏夜出", "p": "zhòu fú yè chū", "m": "白天躲藏，夜晚活动。"}, {"w": "莫大", "p": "mò dà", "m": "非常大。"}, {"w": "土壤", "p": "tǔ rǎng", "m": "供植物生长的泥土。"}, {"w": "空隙", "p": "kòng xì", "m": "物体之间的空处。"}, {"w": "蒙蔽", "p": "méng bì", "m": "隐瞒真相，使人受骗。"}, {"w": "垂头丧气", "p": "chuí tóu sàng qì", "m": "因失望而精神不振。"}, {"w": "疏松", "p": "shū sōng", "m": "松散，不紧密。"}, {"w": "不赖", "p": "bú lài", "m": "不错，挺好。"}]}, {"name": "风中的树苗", "unit": 1, "words": [{"w": "树苗", "p": "shù miáo", "m": "幼小的树。"}, {"w": "掠过", "p": "lüè guò", "m": "轻快地擦过。"}, {"w": "漫步", "p": "màn bù", "m": "悠闲地走。"}, {"w": "窃喜", "p": "qiè xǐ", "m": "暗自高兴。"}, {"w": "风驰电掣", "p": "fēng chí diàn chè", "m": "形容速度极快。"}, {"w": "摇摇欲坠", "p": "yáo yáo yù zhuì", "m": "摇晃得快要掉落。"}, {"w": "刹车", "p": "shā chē", "m": "使车辆停止前进。"}, {"w": "羞惭", "p": "xiū cán", "m": "羞愧而惭愧。"}]}, {"name": "告别网络游戏的汤姆", "unit": 1, "words": [{"w": "网络", "p": "wǎng luò", "m": "连接电脑与设备的系统。"}, {"w": "游戏", "p": "yóu xì", "m": "供娱乐的活动。"}, {"w": "沉迷", "p": "chén mí", "m": "过分迷恋，难以自拔。"}, {"w": "虚拟", "p": "xū nǐ", "m": "由技术模拟而非真实存在。"}, {"w": "自律", "p": "zì lǜ", "m": "自觉约束自己。"}, {"w": "克制", "p": "kè zhì", "m": "控制自己的欲望。"}, {"w": "戒除", "p": "jiè chú", "m": "改掉不好的习惯。"}, {"w": "专注", "p": "zhuān zhù", "m": "集中精神。"}]}, {"name": "我诚实我守信", "unit": 1, "words": [{"w": "诚实", "p": "chéng shí", "m": "说真话，不欺骗。"}, {"w": "守信", "p": "shǒu xìn", "m": "遵守承诺。"}, {"w": "承诺", "p": "chéng nuò", "m": "答应别人要做到的事。"}, {"w": "责任", "p": "zé rèn", "m": "应承担的义务。"}, {"w": "欺骗", "p": "qī piàn", "m": "用假话使人相信。"}, {"w": "坦白", "p": "tǎn bái", "m": "如实说明。"}, {"w": "信任", "p": "xìn rèn", "m": "相信并依靠。"}, {"w": "品德", "p": "pǐn dé", "m": "个人的道德品质。"}]}, {"name": "英雄有泪", "unit": 1, "words": [{"w": "英雄", "p": "yīng xióng", "m": "勇敢而有贡献的人。"}, {"w": "眼泪", "p": "yǎn lèi", "m": "眼睛流出的泪水。 uestions.length){idx++;render()}else finish()}function finish(){show('result');let pct=Math.round(points/questions.length*100),pass=pct>=80;const name='五年级华文词汇应用挑战';$('resultContent').innerHTML=`<div class="certificate"><div style="font-size:54px">${pass?'✦':'◇'}</div><h2>${pass?'词汇挑战达标证书':'挑战成绩报告'}</h2><p>${name}</p><div class="certscore">${pct} 分</div><p>${points} / ${questions.length} 题正确 · ${pass?'成绩合格':'尚未达到80分及格线'}</p>${pass?'<p>兹证明本次词汇挑战达到80分或以上，特颁此证。</p>':'<p>复习错题后，再次挑战即可争取证书。</p>'}<p class="small">完成日期：${new Date().toLocaleDateString('zh-MY')}</p><p class="note">本证书仅证明本次学习活动成绩，不属于官方学历或考试证书。</p></div>`;$('print').classList.toggle('hidden',!pass);renderReview();if(pass)sparkle();setTimeout(()=>speak(`挑战完成！你的成绩是${pct}分。答对${points}题，总共${questions.length}题。${pass?'恭喜你，挑战及格，获得词汇挑战达标证书！':'还没有达到80分及格线，请继续努力！'}`),450)}function renderReview(){const r=$('review');r.replaceChildren();const title=document.createElement('h2');title.textContent=`错题订正（${mistakes.filter(x=>x.corrected).length}/${mistakes.length} 已订正）`;r.append(title);if(!mistakes.length){const t=document.createElement('p');t.textContent='全部答对，无须订正。';r.append(t);return}mistakes.forEach((x,i)=>{const card=document.createElement('div');card.className='review-card';const head=document.createElement('div');head.textContent=`第 ${x.number} 题 · ${x.corrected?'已订正':'待订正'}`;card.append(head);const word=document.createElement('div');word.innerHTML=`<strong>${escapeHtml(x.word)}</strong> · ${escapeHtml(x.pinyin)}<div>词义：${escapeHtml(x.answer)}</div><div>你的答案：${escapeHtml(String(x.given))}</div>`;card.append(word);if(!x.corrected){const label=document.createElement('div');label.textContent='请根据上面的词义，重新输入正确词语：';card.append(label);const input=document.createElement('input');input.placeholder='输入词语';input.setAttribute('aria-label',`第${x.number}题订正`);card.append(input);const msg=document.createElement('div');msg.setAttribute('aria-live','polite');const action=btn('提交订正',()=>{if(input.value.replace(/\s/g,'')===x.word){x.corrected=true;beep(true);renderReview()}else{msg.textContent='订正未正确，请再试一次。';beep(false)}});input.onkeydown=e=>{if(e.key==='Enter')action.click()};card.append(action,msg)}r.append(card)})} function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('start').onclick=start;$('next').onclick=next;$('retry').onclick=start;$('back').onclick=()=>show('home');$('exit').onclick=()=>{speechSynthesis?.cancel();show('home')};$('print').onclick=()=>window.print();$('read').onclick=()=>{let pct=Math.round(points/questions.length*100);speak(`你的成绩是${pct}分。${pct>=80?'恭喜你，成功及格！':'继续努力！'}`)};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='语音：'+(soundOn?'开启':'关闭');if(!soundOn)speechSynthesis?.cancel()};if('speechSynthesis'in window)speechSynthesis.getVoices();</script></body></html>
